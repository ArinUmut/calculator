name: qwen3-marq-uniform
on:
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  uniform:
    if: github.event_name != 'pull_request' || github.head_ref == 'marq-uniform-20260728'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: q3
            bits: 3
            target: 3.125
          - name: q4
            bits: 4
            target: 4.125
    env:
      OMP_NUM_THREADS: "4"
      MKL_NUM_THREADS: "4"
      TOKENIZERS_PARALLELISM: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Reconstruct and patch source
        run: |
          cat marq_chunks/chunk-* | base64 -d > marq-qwen-v0.2.0.zip
          echo "8ac58ae1d89a7421564d1d984022dfcb7aed7a001e8fec95401315ea041400fd  marq-qwen-v0.2.0.zip" | sha256sum -c -
          unzip -q marq-qwen-v0.2.0.zip
          cp -r marq_overlay/marq/. marq-qwen/marq/
          cp -r marq_overlay/tests/. marq-qwen/tests/
          python marq_overlay/apply_patches.py
      - name: Install
        working-directory: marq-qwen
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[qwen,test]'
      - name: Uniform ${{ matrix.name }} smoke
        working-directory: marq-qwen
        run: |
          python scripts/run_qwen3_experiment.py \
            --output runs/${{ matrix.name }} \
            --model-cache models/qwen3-0.6b \
            --block-size 64 \
            --calibration-blocks 1 \
            --evaluation-blocks 1 \
            --probes 1 \
            --rank 8 \
            --bits ${{ matrix.bits }} \
            --target-bpw ${{ matrix.target }} \
            --sweeps 1 \
            --skip-kquants
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qwen3-marq-uniform-${{ matrix.name }}
          path: |
            marq-qwen/runs/${{ matrix.name }}/results.json
            marq-qwen/runs/${{ matrix.name }}/selection-bootstrap.json
          if-no-files-found: warn
