name: qwen3-marq-smoke
on:
  push:
    branches: ["marq-bench-20260728"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  smoke:
    if: github.event_name != 'pull_request' || github.head_ref == 'marq-bench-20260728'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      OMP_NUM_THREADS: "4"
      MKL_NUM_THREADS: "4"
      TOKENIZERS_PARALLELISM: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Reconstruct and verify source
        run: |
          cat marq_chunks/chunk-* | base64 -d > marq-qwen-v0.2.0.zip
          echo "8ac58ae1d89a7421564d1d984022dfcb7aed7a001e8fec95401315ea041400fd  marq-qwen-v0.2.0.zip" | sha256sum -c -
          unzip -q marq-qwen-v0.2.0.zip
          cp marq_overlay/marq/quantizer.py marq-qwen/marq/quantizer.py
          cp marq_overlay/marq/packing.py marq-qwen/marq/packing.py
          cp marq_overlay/marq/categorical.py marq-qwen/marq/categorical.py
          cp marq_overlay/tests/test_quantizer.py marq-qwen/tests/test_quantizer.py
      - name: Install
        working-directory: marq-qwen
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[qwen,test]'
      - name: Unit tests
        working-directory: marq-qwen
        run: pytest -q
      - name: Environment
        working-directory: marq-qwen
        run: python scripts/detect_backend.py | tee backend.json
      - name: Qwen3 MARQ smoke
        working-directory: marq-qwen
        run: |
          python scripts/run_qwen3_experiment.py \
            --output runs/qwen3-smoke \
            --model-cache models/qwen3-0.6b \
            --smoke --skip-kquants
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qwen3-marq-smoke
          path: |
            marq-qwen/runs/qwen3-smoke/results.json
            marq-qwen/runs/qwen3-smoke/selection-bootstrap.json
            marq-qwen/runs/qwen3-smoke/marq-export/
            marq-qwen/backend.json
          if-no-files-found: warn
